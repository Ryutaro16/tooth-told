<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歯の状況把握アプリ">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>歯の状況把握アプリ</title>
<style>
/* 配置：上に帯（アプリ名・記録する人）、切り替え（患者／フォロー／設定）は広い画面では帯の中、狭い画面では下に固定。中身は1列、患者画面だけ歯式図＋一覧。 */
:root{
  --bg:#f2f5f6; --card:#ffffff; --ink:#1c2a33; --sub:#586874; --line:#cfd8de; --soft:#e8eef1;
  --accent:#0f766e; --accent-soft:#d5efeb; --on-accent:#ffffff;
  --watch:#a85507; --watch-soft:#fdebd0;
  --propose:#6d34d6; --propose-soft:#ece4fd;
  --poor:#c81e1e; --poor-soft:#fde0e0;
  --plan:#1d5fd1; --plan-soft:#dde8fb;
  --due:#b4236b; --due-soft:#fbe1ee;
  --ok:#17703f; --ok-soft:#dbf3e4;
  --wait:#0369a1; --wait-soft:#dbeefa;
  --miss:#dfe4e8; --toast:#1c2a33; --toast-ink:#ffffff; --shade:rgba(10,20,26,.45);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181c; --card:#1b2329; --ink:#e5ebee; --sub:#9aa8b2; --line:#34414a; --soft:#242e35;
    --accent:#2cc9b6; --accent-soft:#113a36; --on-accent:#06211e;
    --watch:#f6b73c; --watch-soft:#3a2c10;
    --propose:#ab8ffb; --propose-soft:#2a2144;
    --poor:#f87171; --poor-soft:#401b1b;
    --plan:#7aa7ff; --plan-soft:#1a2a47;
    --due:#f472b6; --due-soft:#40182c;
    --ok:#4ade80; --ok-soft:#12331f;
    --wait:#38bdf8; --wait-soft:#0f3340;
    --miss:#283139; --toast:#e5ebee; --toast-ink:#12181c; --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181c; --card:#1b2329; --ink:#e5ebee; --sub:#9aa8b2; --line:#34414a; --soft:#242e35;
  --accent:#2cc9b6; --accent-soft:#113a36; --on-accent:#06211e;
  --watch:#f6b73c; --watch-soft:#3a2c10;
  --propose:#ab8ffb; --propose-soft:#2a2144;
  --poor:#f87171; --poor-soft:#401b1b;
  --plan:#7aa7ff; --plan-soft:#1a2a47;
  --due:#f472b6; --due-soft:#40182c;
  --ok:#4ade80; --ok-soft:#12331f;
  --wait:#38bdf8; --wait-soft:#0f3340;
  --miss:#283139; --toast:#e5ebee; --toast-ink:#12181c; --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;font-family:var(--font);font-size:1rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=date],input[type=search],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:92px;resize:vertical;line-height:1.6}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--poor);border-color:var(--poor)}
.btn.small{min-height:38px;padding:4px 12px;font-size:.88rem}
.btn:disabled{opacity:.4}
.note{font-size:.82rem;color:var(--sub)}
h2{font-size:1.08rem;margin:22px 0 8px;text-wrap:balance}
h2 small{font-weight:400;color:var(--sub);font-size:.8rem;margin-left:8px}

/* 上の帯と切り替え */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ttl{font-weight:700}
.pv{font-size:.72rem;background:var(--watch-soft);color:var(--watch);border-radius:99px;padding:1px 8px;font-weight:700;white-space:nowrap}
.sp{flex:1}
.me{font-size:.85rem;color:var(--sub);display:flex;align-items:center;gap:6px}
.me select{min-height:40px;padding:4px 8px}
.nav{display:flex;gap:4px}
.gear{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--sub);padding:2px 6px;line-height:1}
.gear .gi{font-size:1.15rem}.gear small{font-size:.6rem;font-weight:700;margin-top:1px}
@media(max-width:560px){.topin{flex-wrap:nowrap;gap:6px}.topin .ttl{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}.topin .pv{flex-shrink:0}.me select{max-width:6.5em}.gear{min-width:40px;min-height:40px;flex-shrink:0}}
.gear.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.nav button{position:relative;min-height:44px;padding:4px 14px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .n{font-size:.7rem;background:var(--due);color:var(--card);border-radius:99px;padding:0 6px;font-weight:700;line-height:1.5}
@media(max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex:1;justify-content:center;flex-direction:column;gap:0;font-size:.8rem;padding:4px 2px;min-height:50px}
  .nav .n{position:absolute;top:2px;right:calc(50% - 30px)}
}
@media(max-width:560px){.wide{display:none}.topin{padding-block:6px}
  .phead .who{order:-1;flex-basis:100%}.phead .btn{min-height:40px;padding:4px 10px;font-size:.9rem}.phead .btn.primary{flex:1}}
main{max-width:1100px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 札・数の箱 */
.bd{font-size:.75rem;border-radius:99px;padding:1px 8px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--sub);display:inline-block}
.bd.watch{background:var(--watch-soft);color:var(--watch)}
.bd.propose{background:var(--propose-soft);color:var(--propose)}
.bd.plan{background:var(--plan-soft);color:var(--plan)}
.bd.poor{background:var(--poor-soft);color:var(--poor)}
.bd.treated{background:var(--ok-soft);color:var(--ok)}
.bd.due{background:var(--due-soft);color:var(--due)}
.bd.ok{background:var(--ok-soft);color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;min-width:0}
.tile b{display:block;font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--sub)}
.tile.watch b{color:var(--watch)} .tile.propose b{color:var(--propose)} .tile.plan b{color:var(--plan)} .tile.due b{color:var(--due)} .tile.poor b{color:var(--poor)} .tile.treated b{color:var(--ok)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tiles.five{grid-template-columns:repeat(5,1fr)}
@media(max-width:560px){.tiles.five{grid-template-columns:repeat(4,1fr)}.tiles.five .tile{grid-column:span 1}.tiles.five .tile:nth-child(-n+3){grid-column:span 2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{min-height:42px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.add{border-style:dashed;color:var(--sub)}
.chip.sm{min-height:36px;padding:2px 12px;font-size:.85rem}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--sub);margin-top:8px}

/* 今日 */
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dayhead b{font-size:1.3rem}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.tcard.seen{opacity:.6}
.tcard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcard .hd .nm{font-weight:700;font-size:1.1rem;flex:1;min-width:8em}
.tcard .hd .nm small{font-weight:400;color:var(--sub);margin-left:6px;font-size:.8rem}
.pts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pts li{display:grid;grid-template-columns:5.2em 1fr;gap:8px;align-items:start;font-size:.92rem}
.pts li .k{text-align:center}
.pts li .say{color:var(--sub);font-size:.84rem}
.pts li b{margin-right:6px}

/* 患者一覧 */
.listhead{display:flex;gap:8px;flex-wrap:wrap}
.listhead input{flex:1;min-width:180px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.prow{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.prow .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;background:transparent;border:0;padding:10px 12px;min-height:56px}
.prow .star{width:64px;border:0;border-left:1px solid var(--line);background:transparent;font-size:.75rem;color:var(--sub);font-weight:700}
.prow .star.on{background:var(--accent-soft);color:var(--accent)}
.cno{color:var(--sub);font-size:.85rem;min-width:3.2em;font-variant-numeric:tabular-nums}
.pn{font-weight:700;flex:1;min-width:6em}
.pn small{font-weight:400;color:var(--sub);margin-left:6px}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* 患者画面 */
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.phead .who{flex:1;min-width:10em}
.phead .who b{font-size:1.25rem}
.phead .who span{color:var(--sub);font-size:.85rem;margin-left:8px}
.phead .who div{color:var(--sub);font-size:.82rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:12px 0}
.tabs button{min-height:44px;padding:6px 16px;border:0;background:transparent;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.hand{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hand .hh{display:flex;align-items:center;gap:8px}
.hand .hh b{flex:1}
.hitem{display:flex;gap:8px;align-items:flex-start;padding:8px 0 0;margin-top:8px;border-top:1px solid var(--soft)}
.hitem .tx{flex:1;min-width:0}
.hitem .tx small{display:block;color:var(--sub);font-size:.78rem}
.hitem.done .tx{color:var(--sub);text-decoration:line-through}

/* 歯式図 */
.chart{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.half{flex:1 1 300px;min-width:0}
@media(min-width:760px){.half+.half{border-left:2px solid var(--line);padding-left:10px}}
.hl{font-size:.75rem;color:var(--sub);margin:0 2px 4px;font-weight:700}
.half:nth-child(2) .hl{text-align:right}
.row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding-top:9px}
.row.lo{margin-top:4px;padding-top:6px;border-top:2px solid var(--line)}
.t{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:center;padding:4px 0;min-height:66px;color:var(--sub);display:flex;flex-direction:column;align-items:center;min-width:0}
.row.up .t{border-radius:8px 8px 14px 14px}
.row.lo .t{border-radius:14px 14px 8px 8px}
.t b{font-size:.95rem;line-height:1.3;font-variant-numeric:tabular-nums}
.t i{font-style:normal;font-weight:700;font-size:1rem;line-height:1.2;min-height:1.2em}
.t small{font-size:.66rem;font-weight:700;line-height:1.2}
.legend .duepill{display:inline-block;background:var(--due);color:var(--card);border-radius:99px;font-size:.7rem;padding:0 5px;margin-right:2px}
.maru{display:inline-block;width:1.25em;height:1.25em;border:1.5px solid currentColor;border-radius:50%;font-size:.7rem;line-height:calc(1.25em - 3px);text-align:center;font-style:normal;vertical-align:middle}
.maru.sm{font-size:.62rem}
.t i .maru{font-size:.82rem;width:1.45em;height:1.45em;line-height:calc(1.45em - 3px)}
.t i.word{font-size:.78rem;line-height:1.5}
.t.wait{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.t .dot.soon{background:var(--wait)}
.legend i.wait{background:var(--wait-soft);border-color:var(--wait)}
.legend .soonpill{display:inline-block;background:var(--wait);color:var(--card);border-radius:99px;font-size:.7rem;padding:0 5px;margin-right:2px}
.bd.wait{background:var(--wait-soft);color:var(--wait)}
.waitcard{border:1px solid var(--wait);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--card)}
.waitcard .wflow{background:var(--wait-soft);border-radius:8px;padding:7px 10px;font-size:.86rem;line-height:1.7;margin:6px 0}
.tplbtn{display:block;width:100%;text-align:left;border:1px dashed var(--wait);color:var(--wait);border-radius:10px;padding:8px 10px;margin:0 0 6px;background:transparent;font:inherit;font-size:.88rem}
.tplbtn.on{border-style:solid;background:var(--wait-soft);font-weight:700}
div.frow .a{cursor:pointer}
.t small.pbig{width:2.1em;font-size:.72rem;line-height:1.1;margin-top:3px}
.t.watch{background:var(--watch-soft);border-color:var(--watch);color:var(--watch)}
.t.propose{background:var(--propose-soft);border-color:var(--propose);color:var(--propose)}
.t.plan{background:var(--plan-soft);border-color:var(--plan);color:var(--plan)}
.t.poor{background:var(--poor-soft);border-color:var(--poor);color:var(--poor);border-width:2px}
.t.treated{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);border-style:dashed}
.t.miss{background:var(--miss);border-style:dashed}
.t.sel{outline:3px solid var(--accent);outline-offset:1px}
.t.dim{opacity:.28}
.t .dot{position:absolute;top:-13px;left:50%;transform:translateX(-50%);height:15px;border-radius:99px;background:var(--due);color:var(--card);font-size:.58rem;font-weight:700;line-height:15px;padding:0 4px;white-space:nowrap;z-index:1}
.t .cnt{position:absolute;bottom:-5px;right:-3px;min-width:16px;height:16px;border-radius:99px;background:var(--ink);color:var(--card);font-size:.62rem;font-weight:700;line-height:16px;padding:0 3px}
.t:disabled{opacity:.5}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin:8px 2px 0}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}
.legend i.watch{background:var(--watch-soft);border-color:var(--watch)}
.legend i.propose{background:var(--propose-soft);border-color:var(--propose)}
.legend i.plan{background:var(--plan-soft);border-color:var(--plan)}
.legend i.poor{background:var(--poor-soft);border-color:var(--poor)}
.legend i.treated{background:var(--ok-soft);border-color:var(--ok);border-style:dashed}
.legend i.miss{background:var(--miss);border-style:dashed;border-color:var(--sub)}
.legend i.duei{background:var(--due);border-color:var(--due);border-radius:99px}

/* 伝えてあること */
.told{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.told .hd{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.told .no{font-weight:700;font-size:1.05rem;border-radius:8px;padding:0 8px;background:var(--soft)}
.told.watch .no{background:var(--watch-soft);color:var(--watch)}
.told.propose .no{background:var(--propose-soft);color:var(--propose)}
.told.plan .no{background:var(--plan-soft);color:var(--plan)}
.told.poor .no{background:var(--poor-soft);color:var(--poor)}
.told .fd{font-weight:700}
.told .say{margin:6px 0 2px}
.told .sub{font-size:.82rem;color:var(--sub);display:flex;gap:4px 12px;flex-wrap:wrap}
.told.done{opacity:.7}
details.donebox{margin-top:16px}
details.donebox summary{cursor:pointer;color:var(--sub);font-weight:600;min-height:44px;display:flex;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts-break{flex-basis:100%;height:0}
.flow{margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:var(--ok-soft);color:var(--ink);font-size:.86rem}
.flow b{color:var(--ok)}
.menu{display:grid;gap:10px}
.menu .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 16px;min-height:52px}
.menu .btn .maru,.acts .btn .maru{font-size:.86rem;width:1.4em;height:1.4em;line-height:calc(1.4em - 3px);margin-right:3px}
.menu .btn small{font-weight:400;font-size:.78rem;opacity:.8}

/* 時系列 */
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px;font-size:.9rem}
.tl li::before{content:"";position:absolute;left:-21px;top:.45em;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--sub)}
.tl li.explain::before,.tl li.re::before{border-color:var(--accent)}
.tl li.check::before{border-color:var(--ok)}
.tl li.warn::before{border-color:var(--poor);background:var(--poor)}
.tl li.done::before{border-color:var(--sub);background:var(--sub)}
.tl li.hand::before{border-color:var(--propose)}
.tl .d{color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums;margin-right:6px}
.tl .w{color:var(--sub);font-size:.8rem}
.tl .q{display:block;color:var(--sub);font-size:.84rem}
.tl.mini{margin-top:10px}
.tl.mini li{padding-bottom:6px;font-size:.84rem}
.ym{font-size:.8rem;color:var(--sub);font-weight:700;margin:14px 0 2px}

/* 1枚まとめ */
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum h3{font-size:.95rem;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sum .st{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.sum .st b{font-size:1.2rem}
.srow{display:grid;grid-template-columns:4.4em 1.1fr 1.1fr 2.2fr 1.4fr;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:.88rem}
.srow.h{font-size:.75rem;color:var(--sub);font-weight:700;padding:4px 0}
.srow>div{min-width:0}
@media(max-width:700px){.srow{grid-template-columns:4.4em 1fr}.srow.h{display:none}.srow>div:nth-child(n+3){grid-column:2}}
.focus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.focus li{font-size:.92rem}

.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;min-height:56px}

@media(min-width:780px){.sheetwrap{align-items:center}.sheet{border-radius:18px}}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sh-head b{flex:1;font-size:1.1rem}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.3rem;line-height:1}
.sh-body{overflow:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;flex:1}

.sec{margin:4px 0 14px}
.sec>.lb{font-size:.82rem;color:var(--sub);font-weight:600;margin-bottom:4px}
.arrow{color:var(--sub);padding:0 4px}
.tpl{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:.88rem}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.82rem;color:var(--sub);font-weight:600;margin-bottom:4px}
.field input,.field select{width:100%}
.lineitem{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;margin-top:6px}
.lineitem span{flex:1;min-width:0;font-size:.9rem}
.lineitem button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0}
/* 確かめる小窓（confirm/prompt の代わり） */
#dlg .sheetwrap{z-index:40;align-items:center;padding:16px}
#dlg .box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#dlg .box h3{margin:0 0 8px;font-size:1.05rem}
#dlg .box p{margin:0 0 12px;color:var(--sub);font-size:.92rem;white-space:pre-wrap}
#dlg .box .acts{justify-content:flex-end}
/* 知らせ */

#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:36px;padding:4px 10px;font-weight:600;white-space:nowrap}
@media print{
  .top,.phead .btn,.tabs,.noprint,#toast,#sheet,#dlg{display:none!important}
  body{background:#fff} main{padding:0;max-width:none} .sum{border:0;padding:0}
}

/* ================= データの読み方 ================= */
const findAll = () => FIND0.concat(db.custom.findings);

const doneH = (m) => m.history.filter((h) => h.kind === 'done').pop();

const treatShort = (m) => (treatOf(m) || {}).short || '';

const waitEnd = (w) => (w.months === 'd' ? fmt(new Date(toDate(w.start).getTime() + (+w.days || 0) * 864e5)) : addMonths(w.start, +w.months));
const waitLen = (w) => (w.months === 'd' ? `${w.days}日` : `${w.months}か月`);
const waitLeft = (w) => daysBetween(today(), waitEnd(w));
const waitState = (w) => { const n = waitLeft(w); return n <= 0 ? 'over' : n <= WAIT_SOON ? 'soon' : 'ok'; };
const waitsOf = (pid, t) => (db.waits || []).filter((w) => w.patientId === pid && (!t || w.tooth === t));
const waitActive = (pid, t) => waitsOf(pid, t).filter((w) => w.status === 'active');
const waitPill = (w) => { const st = waitState(w); return st === 'over' ? '<span class="dot" aria-label="待機が明けた">時期</span>' : st === 'soon' ? `<span class="dot soon" aria-label="待機明けまで">あと${waitLeft(w)}日</span>` : ''; };
const waitBadge = (w) => { const st = waitState(w); return st === 'over' ? '<span class="bd due">待機明け</span>' : st === 'soon' ? `<span class="bd wait">あと${waitLeft(w)}日</span>` : `<span class="bd wait">${jdate(waitEnd(w))}ごろ明け</span>`; };
const fById = (id) => findAll().find((f) => f.id === id);
const lbl = (arr, id) => (arr.find((a) => a.id === id) || {}).label || '';
const catOf = (m) => (POLICY.find((p) => p.id === m.policy) || POLICY[0]).cat;
const pById = (id) => db.patients.find((p) => p.id === id);
const active = (pid) => db.memos.filter((m) => m.patientId === pid && m.status === 'active');
const doneOf = (pid) => db.memos.filter((m) => m.patientId === pid && m.status === 'done');
const isPoor = (m) => m.findings.includes('poor');
const toothCat = (m) => (isPoor(m) ? 'poor' : catOf(m)); // 歯式図の色。予後不良は方針より優先して目立たせる
const doneWhy = (m) => (m.history.filter((h) => h.kind === 'done').pop() || {}).memo || '';
const isTreated = (m) => m.status === 'done' && TREATED_WHY.includes(doneWhy(m));
const treatedOf = (pid) => doneOf(pid).filter(isTreated);
const missingOf = (pid) => new Set(db.missing[pid] || []);
const handOpen = (pid) => db.handoffs.filter((h) => h.patientId === pid && !h.done);
const latest = (arr) => arr.reduce((a, x) => (!a || x.date >= a.date ? x : a), null);
const lastSaid = (m) => latest(m.history.filter((x) => x.kind === 'explain' || x.kind === 're' || (x.kind === 'check' && x.re)));
const lastSeen = (m) => latest(m.history.filter((x) => x.kind === 'explain' || x.kind === 're' || x.kind === 'check'));
const lastCheck = (m) => latest(m.history.filter((x) => x.kind === 'check'));
const saidCount = (m) => m.history.filter((x) => x.kind === 're' || (x.kind === 'check' && x.re)).length;
// 次に確認する時期。決めていない歯は「最後に見てから2年」を目安にする
function due(m) {
  const l = lastSeen(m), base = l ? l.date : today(), t = today();
  if (m.checkEvery === 'none') return { visit: false, none: true, state: 'ok', date: base, implicit: false }; // 期間の定めなし：お知らせしない
  if (m.checkEvery === 'visit') return { visit: true, state: base < t ? 'over' : 'ok', date: base, implicit: false };
  const date = addMonths(base, m.checkEvery ? +m.checkEvery : 24), n = daysBetween(t, date);
  return { visit: false, state: n <= 0 ? 'over' : n <= 30 ? 'soon' : 'ok', date, implicit: !m.checkEvery };
}
const isDue = (m) => m.status === 'active' && due(m).state === 'over';
function dueBadge(m) {
  if (m.status !== 'active') return '';
  const d = due(m);
  if (d.state === 'over') return `<span class="bd due">確認の時期${d.visit ? '（来院のたび）' : d.implicit ? '（2年以上）' : ''}</span>`;
  if (d.state === 'soon') return `<span class="bd">もうすぐ確認 ${jym(d.date)}</span>`;
  return '';
}
function dueText(m) {
  const d = due(m);
  if (d.visit) return '来院のたびに確認';
  if (d.none) return '確認の期間の定めなし';
  return `${d.implicit ? '目安' : lbl(EVERY, m.checkEvery)}：次は ${jym(d.date)}`;
}
function toothMap(pid) {
  const g = {};
  for (const m of active(pid)) {
    const c = toothCat(m), x = g[m.tooth] || (g[m.tooth] = { cat: c, m, n: 0, due: false });
    x.n++; if (isDue(m)) x.due = true;
    if (PRI[c] > PRI[x.cat]) { x.cat = c; x.m = m; }
  }
  // 治療済みの歯は、ほかに伝えてあることがないときだけ緑の丸済で出す
  for (const m of treatedOf(pid)) if (!g[m.tooth]) g[m.tooth] = { cat: 'treated', m, n: 0, due: false };
  // 待機中の歯は、待機をいちばん上に出す（前の記録は歯をタップすると見える）
  for (const w of waitActive(pid)) g[w.tooth] = { ...(g[w.tooth] || { m: null, n: 0 }), cat: 'wait', w, due: false };
  return g;
}
function shortOf(m) {
  const f = m.findings.map(fById).filter(Boolean)[0];

}
// 箱の数：歯ごとに1つの箱だけ（歯式図の色と同じ。予後不良が最優先）
function boxCounts(pid) {
  const b = { poor: 0, watch: 0, propose: 0, plan: 0 }, g = toothMap(pid);
  for (const t in g) if (g[t].cat in b) b[g[t].cat]++;
  b.treated = new Set(treatedOf(pid).map((m) => m.tooth)).size; // 治療した歯の本数（あとで別の記録がついても数える）
  return b;
}
function counts(pid) {
  const c = { poor: 0, watch: 0, propose: 0, plan: 0, treated: treatedOf(pid).length, due: 0, hand: handOpen(pid).length, all: 0 };
  for (const m of active(pid)) { c[catOf(m)]++; c.all++; if (isDue(m)) c.due++; if (isPoor(m)) c.poor++; }
  return c;
}
function findText(m) {
  const f = m.findings.map((id) => (fById(id) || {}).label).filter(Boolean).join('・');
  return (m.sites.length ? m.sites.join('・') + ' ' : '') + f;
}
function ifThenText(m) {

// 選んだ項目をつないで文にする（中身は先生が選んだものだけ。所見から方針を決めることはしない）
function sentence(d) {

  d.findings.map(fById).filter(Boolean).forEach((f, i) => {

  if (p && p.say && !(p.id === 'plan' && th)) out.push(p.say + '。');

function eventText(h, m) {

function chart(pid, o = {}) {

function timelineTab(p) {

  for (const h of db.handoffs.filter((x) => x.patientId === p.id)) ev.push({ date: h.date, tooth: h.tooth, hand: h });
  for (const w of waitsOf(p.id)) { ev.push({ date: w.start, tooth: w.tooth, wait: w, txt: `${w.after} → ${waitLen(w)}待機（次：${w.next}）`, by: w.by });

  const list = ev.filter((e) => !state.tl || e.tooth === state.tl).sort((a, b) => (a.date < b.date ? 1 : -1));
  let html = '', ym = '';

    else html += `<li class="${evClass(e.h)}"><span class="d">${jdate(e.date)}</span><b>${tname(e.tooth)}</b>　${esc(eventText(e.h, e.m))}　<span class="w">${esc(e.h.by)}</span>

function summaryText(p) {

function waitCard(pid, t) {
  const ws = waitsOf(pid, t).sort((a, b) => (a.start < b.start ? -1 : 1));
  if (!ws.length) return '';

  const lines = ws.map((w) => `${jdate(w.start)} ${esc(w.after)} → ${waitLen(w)}待機${w.status === 'done' ? `（${jdate(w.doneDate)} 終了）` : ''}`);
  if (cur) lines.push(`<b style="color:var(--wait)">${jdate(waitEnd(cur))} ごろ ${esc(cur.next)}</b>`);
  let acts = '';
  if (cur) { const nx = nextStep(cur);
    acts = `<div class="acts">${nx ? `<button class="btn primary" data-act="waitNext" data-id="${cur.id}">次の段階へ（${esc(nx.after)} → ${nx.months === 'd' ? nx.days + '日' : nx.months + 'か月'}待機）</button>` : ''}
      <button class="btn ${nx ? '' : 'primary'}" data-act="waitEnd" data-id="${cur.id}">待機を終える</button>
      <button class="btn" data-act="waitDel" data-id="${cur.id}">記録を取り消す</button></div>`; }
  return `<div class="waitcard"><div class="hd"><b>待機</b>　${cur ? `${esc(cur.after)}後 ${waitLen(cur)} → 次：${esc(cur.next)}　${waitBadge(cur)}` : '終わった待機'}</div>
    <div class="wflow">${lines.join('<br>')}</div><span class="note">記録：${esc((cur || ws[ws.length - 1]).by)}</span>${acts}</div>`;
}

      ${waitTplAll().map((tp) => `<div class="lineitem"><span>${esc(tplText(tp))}${WAIT_TPL0.includes(tp) ? '<br><span class="note">初めから入っているひな形</span>' : ''}</span>${WAIT_TPL0.includes(tp) ? '' : `<button data-act="delWaitTpl" data-id="${tp.id}" aria-label="消す">×</button>`}</div>`).join('')}

      <p class="note" style="margin-top:0">データはこの端末の中だけにあります。iPad をなくしたり壊したりしたときに戻せるのは、最後に書き出したバックアップまでです。週に1回「書き出す」で、AirDrop などで院内のパソコンに保存してください。${db.settings.lastExport ? `最後の書き出し：${jdate(db.settings.lastExport)}` : 'まだ一度も書き出していません。'}</p>
      <div class="chips"><button class="btn" data-act="exportJson">書き出す</button><button class="btn" data-act="importJson">読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden></div></div>
    <div class="sec"><div class="lb">見本で試す</div>
      <p class="note" style="margin-top:0">使い方を試すときに、架空の見本の患者を入れられます。今入っているデータは消えるので、先に書き出してください。</p>
      <div class="chips"><button class="btn" data-act="reset">見本を入れて試す</button><button class="btn danger" data-act="clearAll">すべて消す</button></div></div>`;
}

/* ================= 確かめる小窓（confirm / prompt の代わり） ================= */
let dlgCb = null;
function ask(o, cb) {
  dlgCb = cb;
  $('#dlg').innerHTML = `<div class="sheetwrap"><div class="box" role="alertdialog" aria-modal="true" aria-label="${esc(o.title)}"><h3>${esc(o.title)}</h3>${o.text ? `<p>${esc(o.text)}</p>` : ''}
    ${(o.fields || []).map((f) => `<label class="field"><span>${esc(f.label)}</span><input type="text" id="dlg_${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off"></label>`).join('')}
    ${o.copy ? `<textarea id="dlg_copy" readonly style="min-height:200px">${esc(o.copy)}</textarea>` : ''}
    <div class="acts">${o.copy ? '' : '<button class="btn" data-act="dlgNo">やめる</button>'}<button class="btn ${o.danger ? 'danger' : 'primary'}" data-act="dlgOk">${esc(o.ok || 'OK')}</button></div></div></div>`;
  $('#dlg').hidden = false;
  const first = $('#dlg input,#dlg textarea'); if (first) { first.focus(); if (o.copy) first.select(); }
}
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; dlgCb = null; }

/* ================= 操作 ================= */
function newDraft(t, pick) {
  draft = { id: null, teeth: t ? [t] : [], findings: [], sites: [], policy: 'watch', when: '', then: '', said: '', saidEdited: false, reaction: 'agree', checkEvery: '', date: today(), by: db.settings.me };
  openSheet('editor', { pick });
}
const memo = (id) => db.memos.find((m) => m.id === id);
const touch = (m) => { m.updatedAt = Date.now(); };
// 待機の画面で手で入れた日付・人・日数を、画面を描き直す前に控えておく
function keepWaitInputs() { if (!draft) return; const s = $('#wstart'), b = $('#wby'), d = $('#wdays'); if (s) draft.start = s.value || today(); if (b) draft.by = b.value; if (d) draft.days = d.value; }
function keepTplInputs() { if (!draft || !draft.steps) return; const n = $('#tname'); if (n) draft.name = n.value;
  draft.steps.forEach((st, i) => { const a = $('#ta' + i), m = $('#tm' + i), x = $('#tn' + i); if (a) st.after = a.value; if (m) st.months = m.value; if (x) st.next = x.value; }); }
function refresh() { render(); if (sheet) renderSheet(); }
function openTooth(t) { draft = null; openSheet('tooth', { t }); }

const ACT = {
  nav(b) { state.view = b.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  follow(b) { state.view = 'follow'; state.ff = b.dataset.f; render(); window.scrollTo(0, 0); },
  open(b) {
    state.from = state.view === 'patient' ? state.from : state.view;
    state.view = 'patient'; state.pid = b.dataset.pid; state.tab = b.dataset.tab || 'chart'; state.cf = ''; state.tl = 0;
    closeSheet(); render(); window.scrollTo(0, 0);
    if (b.dataset.t) openTooth(+b.dataset.t);
  },
  back() { state.view = state.from || 'list'; render(); },
  tab(b) { state.tab = b.dataset.v; render(); },
  cf(b) { state.cf = state.cf === b.dataset.v ? '' : b.dataset.v; render(); },
  tl(b) { state.tl = +b.dataset.v; render(); },
  lf(b) { state.lf = b.dataset.v; render(); },
  close() { closeSheet(); },
  shade(b, e) { if (e.target === b && sheet && sheet.kind !== 'editor' && sheet.kind !== 'hand' && sheet.kind !== 'check') closeSheet(); },
  back2tooth() { const t = sheet.back; if (t) openTooth(t); else closeSheet(); },
  tooth(b) {
    const t = +b.dataset.t, p = patient();
    // 記録がなく欠損でもない歯は、すぐ記録の画面へ（タップを減らす）
    if (!db.memos.some((m) => m.patientId === p.id && m.tooth === t) && !waitsOf(p.id, t).length && !missingOf(p.id).has(t)) return openSheet('blank', { t });
    openTooth(t);
  },
  newWait() { const t = sheet.t, pid = patient().id; draft = { tooth: t, tpl: '', step: 0, after: '', afters: [], months: '', days: '', next: '', start: today(), by: db.settings.me };
    openSheet('wait', { back: waitsOf(pid, t).length || db.memos.some((m) => m.patientId === pid && m.tooth === t) ? t : 0 }); },
  wtpl(b) { const tp = waitTplAll().find((x) => x.id === b.dataset.v), s0 = tp.steps[0]; keepWaitInputs(); Object.assign(draft, { tpl: tp.id, step: 0, after: s0.after, afters: [s0.after], months: s0.months, days: s0.days || '', next: s0.next }); renderSheet(); },
  wchip(b) {
    keepWaitInputs(); const k = b.dataset.k, v = b.dataset.v;
    if (k === 'after') { draft.afters = draft.afters.includes(v) ? draft.afters.filter((x) => x !== v) : [...draft.afters, v]; draft.after = draft.afters.join('・'); } // 何のあとかは複数選べる
    else draft[k] = v;
    draft.tpl = ''; renderSheet();
  },
  wdays() { keepWaitInputs(); renderSheet(); },
  waddItem(b) {
    const k = b.dataset.k; keepWaitInputs();
    ask({ title: k === 'after' ? '「何のあとか」に足す' : '「次にすること」に足す', ok: '追加', fields: [{ id: 'name', label: '項目の名前', placeholder: k === 'after' ? '例：上顎洞底挙上' : '例：仮歯' }] }, (v) => {
      const name = (v.name || '').trim(); if (!name) return toast('名前を入れてください');
      const key = k === 'after' ? 'wafter' : 'wnext'; db.custom[key] = db.custom[key] || [];
      if (!db.custom[key].includes(name)) db.custom[key].push(name);
      if (k === 'after') { if (!draft.afters.includes(name)) draft.afters.push(name); draft.after = draft.afters.join('・'); } else draft[k] = name;
      draft.tpl = ''; save(); renderSheet();
    });
  },
  saveWait() {
    keepWaitInputs(); const d = draft, p = patient(), t = d.tooth;
    if (d.months === 'd' && !(+d.days > 0)) return toast('日数を入れてください');
    addWait(p.id, t, d); save(); render(); openTooth(t); toast(`${tname(t)}：待機を記録しました（${jdate(waitEnd(d))}ごろ明け）`);
  },
  waitNext(b) {
    const w = db.waits.find((x) => x.id === b.dataset.id), nx = nextStep(w);
    w.status = 'done'; w.doneDate = today(); w.doneBy = db.settings.me;
    addWait(w.patientId, w.tooth, { ...nx, tpl: w.tpl, step: w.step + 1 }); save(); refresh(); toast(`${tname(w.tooth)}：${nx.after}後の待機を始めました`);
  },
  waitEnd(b) { const w = db.waits.find((x) => x.id === b.dataset.id); w.status = 'done'; w.doneDate = today(); w.doneBy = db.settings.me; save(); refresh(); toast(`${tname(w.tooth)}：待機を終えました`); },
  waitDel(b) {
    ask({ title: 'この待機の記録を取り消しますか？', text: '間違えて記録したときに使います。', ok: '取り消す', danger: true }, () => {
      db.waits = db.waits.filter((x) => x.id !== b.dataset.id); save(); refresh(); toast('待機の記録を取り消しました');
    });
  },
  newWaitTpl() { draft = { name: '', steps: [{ after: '根の治療', months: '3', next: 'かぶせ物' }] }; openSheet('tplEdit'); },
  tplAddStep() { keepTplInputs(); const l = draft.steps[draft.steps.length - 1]; draft.steps.push({ after: l.next, months: '3', next: '型取り' }); renderSheet(); },
  tplDelStep(b) { keepTplInputs(); draft.steps.splice(+b.dataset.i, 1); renderSheet(); },
  saveWaitTpl() {
    keepTplInputs(); const name = draft.name.trim(); if (!name) return toast('ひな形の名前を入れてください');
    db.waitTpl.push({ id: 'x_' + uid(), label: name, steps: draft.steps.map((x) => ({ ...x })) }); save(); closeSheet(); render(); toast(`ひな形「${name}」を足しました`);
  },
  delWaitTpl(b) {
    ask({ title: 'このひな形を消しますか？', text: 'これまでの待機の記録はそのまま残ります。', ok: '消す', danger: true }, () => {
      db.waitTpl = db.waitTpl.filter((x) => x.id !== b.dataset.id); save(); render(); toast('ひな形を消しました');
    });
  },
  newPlan() { newDraft(sheet.t, false); draft.policy = 'plan'; draft.then = 'treat'; draft.said = sentence(draft); renderSheet(); },
  newTreated() { draft = { id: null, tooth: sheet.t, why: '治療した', treat: '', treatMode: true }; openSheet('done', { back: 0 }); },
  blankMiss() { const p = patient(), t = sheet.t, ms = missingOf(p.id); ms.add(t); db.missing[p.id] = [...ms]; save(); closeSheet(); render(); toast(`${tname(t)}：欠損にしました`); },
  newMemo() { if (sheet && (sheet.kind === 'tooth' || sheet.kind === 'blank')) newDraft(sheet.t, false); else newDraft(null, true); },
  morePick() { sheet.pick = true; renderSheet(); },
  pick(b) { const t = +b.dataset.t; draft.teeth = draft.teeth.includes(t) ? draft.teeth.filter((x) => x !== t) : [...draft.teeth, t]; renderSheet(); },
  chip(b) {
    const k = b.dataset.k, v = b.dataset.v;
    if (Array.isArray(draft[k])) draft[k] = draft[k].includes(v) ? draft[k].filter((x) => x !== v) : [...draft[k], v];
    else draft[k] = draft[k] === v && k !== 'policy' && k !== 'result' && k !== 're' ? '' : v;
    if (sheet.kind === 'editor' && !draft.saidEdited) draft.said = sentence(draft);
    renderSheet();
  },
  regen() { draft.said = sentence(draft); draft.saidEdited = false; renderSheet(); },
  useTpl(b) { draft.said = db.settings.templates[+b.dataset.i]; draft.saidEdited = true; renderSheet(); },
  saveTpl() {
    const s = draft.said.trim();
    if (!s) return toast('文が空です');
    if (db.settings.templates.includes(s)) return toast('同じ定型文があります');
    db.settings.templates.push(s); save(); toast('定型文に登録しました'); renderSheet();
  },
  addItem(b) {
    const k = b.dataset.k, isWhen = k === 'when' || k === 'treat';
    ask({ title: `「${CUSTOM_KIND[k]}」に項目を足す`, ok: '追加',
      fields: [{ id: 'name', label: '項目の名前', placeholder: k === 'findings' ? '例：知覚過敏' : k === 'treat' ? '例：ブリッジ' : isWhen ? '例：しみたら' : '例：ブリッジ' }]
        .concat(isWhen ? [] : [{ id: 'say', label: '患者さんへの言い方（空なら自動）', placeholder: k === 'findings' ? '例：歯がしみやすくなっています' : '例：ブリッジにしましょう' }]) }, (v) => {
      const name = (v.name || '').trim(); if (!name) return toast('名前を入れてください');
      const all = k === 'findings' ? findAll() : k === 'treat' ? treatAll() : isWhen ? whenAll() : thenAll();
      if (shown(all).some((f) => f.label === name)) return toast('同じ項目があります');
      const say = (v.say || '').trim().replace(/。$/, '') || (k === 'findings' ? name + 'があります' : name + 'にしましょう');
      const f = { id: 'x_' + uid(), label: name, short: name.slice(0, k === 'treat' ? 3 : 2), ...(isWhen ? {} : { say }) };
      (db.custom[k] = db.custom[k] || []).push(f);
      if (k === 'treat' && draft && sheet && sheet.kind === 'done') draft.treat = f.id;
      if (draft && sheet && sheet.kind === 'editor') {
        if (k === 'findings') draft.findings.push(f.id); else draft[k] = f.id;
        if (!draft.saidEdited) draft.said = sentence(draft);
      }
      save(); refresh(); toast(`「${name}」を足しました`);
    });
  },
  delItem(b) { const f = db.custom[b.dataset.k].find((x) => x.id === b.dataset.id); if (f) f.hidden = true; save(); render(); toast('選ぶ一覧から外しました（これまでの記録の表示は残ります）'); },
  saveMemo() {
    const d = draft, p = patient();
    if (!d.teeth.length) return;
    const fields = { findings: d.findings, sites: d.sites, policy: d.policy || 'watch', ifThen: { when: d.when, then: d.then }, said: d.said.trim() || sentence(d), reaction: d.reaction, checkEvery: d.checkEvery };
    if (d.id) {
      const m = memo(d.id); Object.assign(m, fields); m.history.push({ date: today(), by: db.settings.me, kind: 'edit', memo: '' }); touch(m);
    } else {
      const ms = missingOf(p.id);
      for (const t of d.teeth) {
        db.memos.push({ id: uid(), patientId: p.id, tooth: t, ...fields, findings: [...d.findings], sites: [...d.sites], ifThen: { ...fields.ifThen }, status: 'active',
          history: [{ date: d.date || today(), by: d.by, kind: 'explain', memo: '' }], createdAt: Date.now(), updatedAt: Date.now() });
        ms.delete(t);
      }
      db.missing[p.id] = [...ms];
    }
    save(); const ts = teethTitle(d.teeth); closeSheet(); render(); toast(`${ts}：保存しました`);
  },
  edit(b) {
    const m = memo(b.dataset.id);
    draft = { id: m.id, teeth: [m.tooth], findings: [...m.findings], sites: [...m.sites], policy: m.policy, when: m.ifThen.when, then: m.ifThen.then, said: m.said, saidEdited: true, reaction: m.reaction, checkEvery: m.checkEvery };
    openSheet('editor', { pick: false });
  },
  quick(b) {
    const m = memo(b.dataset.id), h = { date: today(), by: db.settings.me, kind: 'check', result: 'same', re: true, memo: '' };
    m.history.push(h); touch(m); save(); refresh();
    toast(`${tname(m.tooth)}：変化なし・説明を記録（${db.settings.me}）`, () => { m.history = m.history.filter((x) => x !== h); save(); refresh(); });
  },
  check(b) {
    const m = memo(b.dataset.id);
    draft = { id: m.id, result: '', re: 'yes', memo: '', checkEvery: m.checkEvery, date: today(), by: db.settings.me };
    openSheet('check', { back: m.tooth });
  },
  saveCheck() {
    const d = draft, m = memo(d.id);
    m.history.push({ date: d.date || today(), by: d.by, kind: 'check', result: d.result, re: d.re === 'yes', memo: (d.memo || '').trim() });
    m.checkEvery = d.checkEvery; touch(m); save();
    render(); openTooth(m.tooth); toast(`${tname(m.tooth)}：確認を記録しました（${lbl(RESULT, d.result)}）`);
  },
  done(b) { const m = memo(b.dataset.id); draft = { id: m.id, tooth: m.tooth, why: '', treat: '' }; openSheet('done', { back: m.tooth }); },
  saveDone() {
    let m = draft.id && memo(draft.id);
    if (!m) { // 記録のない歯をそのまま治療済みにする
      const now = Date.now();
      m = { id: uid(), patientId: patient().id, tooth: draft.tooth, findings: [], sites: [], policy: 'plan', ifThen: { when: '', then: 'treat' }, said: '', reaction: 'agree',
        checkEvery: '', status: 'active', history: [], createdAt: now, updatedAt: now };
      db.memos.push(m);
    }
    m.status = 'done'; m.history.push({ date: today(), by: db.settings.me, kind: 'done', memo: draft.why, ...(draft.why === '治療した' && draft.treat ? { treat: draft.treat } : {}) }); touch(m);
    save(); closeSheet(); render(); toast(`${tname(m.tooth)}：済みにしました`);
  },
  // 1回押すだけで治療予定に（取り消しは「直す」で方針を戻す）
  toPlan(b) {
    const m = memo(b.dataset.id);
    m.history.push({ date: today(), by: db.settings.me, kind: 'toPlan', memo: lbl(POLICY, m.policy) }); m.policy = 'plan'; touch(m);
    save(); refresh(); toast(`${tname(m.tooth)}：治療予定にしました`);
  },
  // 1回押すだけで治療済みに（「済みにする」の理由「治療した」と同じ。この歯の済みの欄の「元に戻す」で取り消せる）
  toTreated(b) { const m = memo(b.dataset.id); draft = { id: m.id, tooth: m.tooth, why: '治療した', treat: '', treatMode: true }; openSheet('done', { back: m.tooth }); },
  reopen(b) {
    const m = memo(b.dataset.id);
    m.status = 'active'; m.history.push({ date: today(), by: db.settings.me, kind: 'reopen', memo: '' }); touch(m);
    save(); refresh(); toast(`${tname(m.tooth)}：元に戻しました`);
  },
  toggleMiss() {
    const p = patient(), ms = missingOf(p.id), t = sheet.t;
    if (ms.has(t)) ms.delete(t); else ms.add(t);
    db.missing[p.id] = [...ms]; save(); refresh();
  },
  addHand(b) { draft = { text: '', tooth: +(b.dataset.t || 0) }; openSheet('hand'); },
  saveHand() {
    const text = ($('#htext').value || '').trim(); if (!text) return toast('内容を入れてください');
    db.handoffs.push({ id: uid(), patientId: state.pid, tooth: +$('#htooth').value || 0, text, by: db.settings.me, date: today(), done: false, doneBy: '', doneDate: '' });
    save(); closeSheet(); render(); toast('申し送りを保存しました');
  },
  handDone(b) {
    const h = db.handoffs.find((x) => x.id === b.dataset.id); if (!h) return;
    h.done = !h.done; h.doneBy = h.done ? db.settings.me : ''; h.doneDate = h.done ? today() : '';
    save(); render(); toast(h.done ? '申し送りを済みにしました' : '申し送りを戻しました');
  },
  pickToday() { openSheet('pickToday', { q: '' }); },
  todayToggle(b) {
    const id = b.dataset.pid, i = db.today.ids.indexOf(id), p = pById(id);
    if (i >= 0) db.today.ids.splice(i, 1); else db.today.ids.push(id);
    save(); refresh(); if (!sheet) toast(i >= 0 ? `${p.name} さんを今日の一覧から外しました` : `${p.name} さんを今日の一覧に入れました`);
  },
  seen(b) { const id = b.dataset.pid, i = db.today.seen.indexOf(id); if (i >= 0) db.today.seen.splice(i, 1); else db.today.seen.push(id); save(); render(); },
  addPatient() { openSheet('patient', { isNew: true, p: { id: uid(), chartNo: '', name: '', kana: '', birth: '', note: '', createdAt: Date.now() } }); },
  editPatient() { openSheet('patient', { isNew: false, p: { ...patient() } }); },
  savePatient() {
    const p = sheet.p;
    for (const k of ['chartNo', 'name', 'kana', 'birth', 'note']) p[k] = ($('#f_' + k).value || '').trim();
    if (!p.name) return toast('氏名を入れてください');

  },
  delPatient() {

      db.patients = db.patients.filter((x) => x.id !== p.id); db.memos = db.memos.filter((m) => m.patientId !== p.id);
      db.handoffs = db.handoffs.filter((h) => h.patientId !== p.id); db.today.ids = db.today.ids.filter((i) => i !== p.id); delete db.missing[p.id];

  addStaff() {

    if (!n) return; if (db.settings.staff.includes(n)) return toast('同じ名前があります');

  font(b) { db.settings.font = b.dataset.v; save(); render(); },
  delTpl(b) { db.settings.templates.splice(+b.dataset.i, 1); save(); render(); },
  copySum() {

    try { navigator.clipboard.writeText(text).then(() => toast('コピーしました。カルテに貼り付けできます'), fallback); } catch (e) { fallback(); }
  },
  print() { try { window.print(); } catch (e) { toast('印刷できませんでした'); } },
  exportJson() {
    if (inFrame) return toast('この画面では書き出しできません');
    const d = new Date(), name = `tooth-told-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
    const text = JSON.stringify({ app: 'tooth-told', version: 2, exportedAt: d.toISOString(), ...db }, null, 1);
    const done = () => { db.settings.lastExport = today(); save(); render(); toast('書き出しました。院内のパソコンに保存してください'); };
    // iPad・iPhone では「共有」から AirDrop・ファイルに保存 を選べるようにする
    try {
      const file = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(done, (err) => { if (err && err.name !== 'AbortError') toast('書き出せませんでした'); });
        return;
      }
    } catch (e) { /* 共有が使えない端末は下の保存へ */ }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    done();
  },
  importJson() { $('#importFile').click(); },
  reset() {
    ask({ title: '見本を入れて試しますか？', text: '今入っているデータはすべて消えます（先に書き出しておくと戻せます）。', ok: '見本を入れる', danger: true }, () => {
      db = migrate(sample()); save(); closeSheet(); state.view = 'list'; render(); toast('見本を入れました');
    });
  },
  clearAll() {
    ask({ title: 'すべて消しますか？', text: '患者・記録・待機・申し送りがすべて消えます。記録する人・定型文・足した項目は残ります。元に戻せません（書き出したバックアップからは戻せます）。', ok: 'すべて消す', danger: true }, () => {
      const keep = { custom: db.custom, settings: db.settings, waitTpl: db.waitTpl };
      db = migrate({ patients: [], memos: [], missing: {}, handoffs: [], waits: [], ...keep }); save(); closeSheet(); state.view = 'list'; render(); toast('すべて消しました');
    });
  },
  dlgOk() {
    const cb = dlgCb, v = {};
    document.querySelectorAll('#dlg input').forEach((i) => { v[i.id.replace('dlg_', '')] = i.value; });
    closeDlg(); if (cb) cb(v);
  },
  dlgNo() { closeDlg(); },
};

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (!$('#dlg').hidden && !b.closest('#dlg')) return;
  const f = ACT[b.dataset.act];
  if (f) f(b, e);
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'said') {
    draft.said = e.target.value; draft.saidEdited = true;
    const ok = draft.teeth.length && (draft.findings.length || draft.said.trim());
    const sv = $('[data-act="saveMemo"]'); if (sv) sv.disabled = !ok;
  } else if (id === 'q') { state.q = e.target.value; renderRows(); }
  else if (id === 'tq') {
    sheet.q = e.target.value; const pos = e.target.selectionStart; renderSheet();
    const el = $('#tq'); el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* 対応していない入力欄 */ }
  }
  else if (id === 'd' && draft) draft.date = e.target.value;
  else if (id === 'cmemo' && draft) draft.memo = e.target.value;
  else if (id === 'htext' && draft) draft.text = e.target.value;
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'me') { db.settings.me = e.target.value; save(); }
  else if (id === 'by' && draft) draft.by = e.target.value;
  else if (id === 'htooth' && draft) draft.tooth = +e.target.value;
  else if (id === 'sort') { state.sort = e.target.value; renderRows(); }
  else if (id === 'importFile') {
    const f = e.target.files[0]; if (!f) return;
    f.text().then((s) => {
      const d = JSON.parse(s);
      if (d.app !== 'tooth-told' || !Array.isArray(d.patients) || !Array.isArray(d.memos)) throw new Error('このアプリのバックアップではありません');
      ask({ title: 'バックアップを読み込みますか？', text: `患者 ${d.patients.length}人・説明 ${d.memos.length}件を読み込みます。今のデータは置き換わります。`, ok: '読み込む', danger: true }, () => {
        const { app, version, exportedAt, ...rest } = d; // 待機・ひな形・最後の書き出し日も含めて戻す
        db = migrate(rest);
        save(); closeSheet(); state.view = 'list'; render(); toast('読み込みました');
      });
    }).catch((err) => toast('読み込めませんでした：' + err.message));
    e.target.value = '';
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'q') { const rows = document.querySelectorAll('#rows .go'); if (rows.length === 1) rows[0].click(); }
  if (e.key === 'Enter' && e.target.closest('#dlg') && e.target.tagName === 'INPUT') ACT.dlgOk();
  if (e.key === 'Enter' && e.target.id === 'newStaff') ACT.addStaff();
  if (e.key === 'Escape') { if (!$('#dlg').hidden) closeDlg(); else if (sheet) closeSheet(); }
});

let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undo">取り消し</button>' : ''}`;
  el.hidden = false;
  if (undo) $('#undo').onclick = () => { undo(); el.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3000);
}

load().then(render);
</script>
